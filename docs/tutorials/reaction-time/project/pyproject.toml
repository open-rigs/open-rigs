[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "open-rigs-reaction-time"
description = "A library that defines a open-rigs data schema for the reaction-time experiment."
authors = [ {name = "RoboDoig", email = "a.erskine@neurogears.org"}]
license = "MIT"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "swc-aeon>=0.2.0",
  "open-rigs",
  "pydantic-settings",
  "GitPython"
]

# [project.urls]
# Documentation = "https://open-rigs.github.io/Open.Rigs.ReactionTime/"
# Repository = "https://github.com/OpenRigs/Open.Rigs.ReactionTime/"
# Issues = "https://github.com/OpenRigs/Open.Rigs.ReactionTime/issues"
# Changelog = "https://github.com/OpenRigs/Open.Rigs.ReactionTime/releases"
[project.scripts]
reaction-time = "open_rigs_reaction_time.cli:main"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
open-rigs = {git = "https://github.com/open-rigs/open-rigs", branch = "update-project-tutorial"}
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", branch = "main" }